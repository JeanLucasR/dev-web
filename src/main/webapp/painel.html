<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de senhas</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="js/painelApp.js" defer></script>
</head>
<body>
    <div id="app">
        <section>
            <h2>Senha chamada</h2>

            <div v-if="atual">
                <h1>{{ atual.codigo }}</h1>
                <p>Guichê {{ atual.guiche }}</p>
            </div>
            <p v-else>Aguardando a primeira chamada.</p>
        </section>

        <section>
            <h3>Últimas chamadas</h3>

            <ul v-if="ultimas.length > 0">
                <li v-for="(s, indice) in ultimas" :key="indice">
                    {{ s.codigo }} - Guichê {{ s.guiche }}
                </li>
            </ul>
            <p v-else>Nenhuma chamada anterior.</p>
        </section>

        <section v-if="semConexao">
            <p>Sem conexão com o servidor. Tentando novamente.</p>
        </section>
    </div>
</body>
</html>
